name: CI — typecheck + tests

# Gates every push and PR with the regression net. Tests use Node's built-in
# runner (node --test) via the tsx loader — no extra test deps to install.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # format:check diffs against the merge-base with the target branch,
          # so it needs history, not just the tip commit.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: API contract generated files
        run: npm run check:api-contract

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format (files changed against the base branch)
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build (verify dist compiles, no test files emitted)
        run: |
          npm run build
          if find dist -name '*.test.js' | grep -q .; then
            echo "::error ::test files leaked into dist/"; exit 1
          fi

  # Coverage is a single-version job: the numbers do not differ across the Node
  # matrix, and running c8 three times would triple CI time for one report.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
