name: Release — build artifacts on tag

# Triggered when a tag matching v*.*.* is pushed. Builds three artifacts and
# attaches them to a GitHub Release (creating it if it doesn't exist).
#
# To cut a release:
#   1. Bump version in package.json (e.g. via `npm version patch`).
#   2. Push the tag: git push --follow-tags
#   3. This workflow runs, posts the GitHub Release, and publishes to npm.
#
# Two jobs: `build` assembles the artifacts and creates the Release;
# `npm-publish` then pushes the same version to the registry. npm publishing
# used to be a manual local step and was missed four releases running
# (v0.21–v0.24 shipped while npm served 0.20.0), so it now rides the tag.
#
# The release notes are pulled from docs/RELEASE_v<version>.md if it exists,
# otherwise auto-generated from the tag's commit list.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write   # needed to create releases + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # If triggered manually with a tag input, fetch that ref;
          # otherwise the default ref (the pushed tag) is fine.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Resolve version
        id: ver
        run: |
          # Strip leading 'v' from the tag.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for $TAG (version $VERSION)"

      - name: Verify package.json matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "✗ package.json version $PKG_VERSION != tag ${{ steps.ver.outputs.version }}" >&2
            exit 1
          fi

      # Test gate: full dev install just for the suite — build-release.sh
      # re-runs `npm ci --omit=dev` itself for the actual artifacts.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build release artifacts
        run: bash scripts/build-release.sh

      - name: Resolve release notes
        id: notes
        run: |
          NOTES_FILE="docs/RELEASE_v${{ steps.ver.outputs.version }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "✓ found $NOTES_FILE"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "⚠ no $NOTES_FILE — release will use auto-generated notes."
          fi

      - name: Generate checksums
        run: |
          cd dist-release
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Lisa ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
          files: |
            dist-release/lisa-source-v${{ steps.ver.outputs.version }}.tar.gz
            dist-release/lisa-mac-bundle-v${{ steps.ver.outputs.version }}.zip
            dist-release/lisa-linux-bundle-v${{ steps.ver.outputs.version }}.tar.gz
            dist-release/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── npm ──────────────────────────────────────────────────────────────────
  # Publishing has been manual since the beginning, and it kept being missed:
  # v0.21 → v0.24 all shipped a GitHub Release while npm sat at 0.20.0, so
  # `npm i -g @oratis/lisa` and the Homebrew formula served a build four
  # versions old. This job removes the step a human has to remember.
  #
  # It runs only AFTER `build` succeeds, so npm never receives a version whose
  # tests failed or whose artifacts didn't assemble. The heavy gate is already
  # in package.json's `prepublishOnly` (api-contract + typecheck + test +
  # build), which `npm publish` runs on its own — so this job stays thin.
  #
  # One-time setup: add an npm automation token as the NPM_TOKEN repo secret
  # (npmjs.com → Access Tokens → Generate → Automation; it bypasses 2FA, which
  # an interactive OTP prompt can't do in CI).
  npm-publish:
    needs: build
    # Tag pushes only. workflow_dispatch exists to rebuild artifacts for a tag
    # that already shipped — re-publishing that to npm is never wanted.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # required by --provenance
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Makes re-runs safe: npm rejects a duplicate version with a hard error,
      # which would turn an otherwise-green release into a red one.
      - name: Skip if this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          V="${{ steps.ver.outputs.version }}"
          if npm view "$NAME@$V" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "→ $NAME@$V is already on npm; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "→ $NAME@$V not on npm; will publish."
          fi

      - name: Install dependencies
        if: steps.check.outputs.published == 'false'
        run: npm ci

      # --provenance attaches a signed, verifiable link from the tarball back
      # to this workflow run and commit, so consumers can check where the
      # package came from. prepublishOnly runs the full gate before upload.
      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
